<style>
        .bg-hex-grid {
            background-color: #0A0A0C;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 0l20 10v20L20 40 0 30V10z' fill-rule='evenodd' stroke='%23201f21' stroke-width='1' fill='none' stroke-opacity='0.1'/%3E%3C/svg%3E");
            background-size: 40px 40px;
        }
        .glitch-hover:hover {
            box-shadow: 4px 4px 0px 0px #00dce5;
            transform: translate(-2px, -2px);
        }
        .glow-crimson {
            box-shadow: 0 0 40px -10px rgba(226, 27, 35, 0.4);
        }
        .scanline::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(226, 27, 35, 0.5);
            animation: scan 4s linear infinite;
            opacity: 0.5;
        }
        @keyframes scan {
            0% { top: -5%; }
            100% { top: 105%; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center bg-hex-grid relative overflow-hidden">
<!-- Top AppBar (from JSON, adapted for splash screen - suppressing navigation shell mostly, keeping brand) -->
<header class="fixed top-0 w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 z-50">
<div class="font-display-lg text-display-lg-mobile text-primary-container tracking-tighter uppercase italic drop-shadow-[0_0_10px_rgba(226,27,35,0.5)]">FRAUDOPS</div>
</header>
<!-- Background Atmospheric Effects -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-secondary-container/10 rounded-full blur-[100px]"></div>
</div>
<!-- Login Card -->
<main class="w-full max-w-md px-margin-mobile z-10 relative">
<div class="bg-[rgba(10,10,12,0.7)] backdrop-blur-[20px] border border-white/10 rounded-none p-8 glow-crimson relative overflow-hidden scanline">
<div class="mb-8 text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2 tracking-tight uppercase">Enter the Ops Network</h1>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Authentication Required</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="sr-only" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-tertiary transition-colors">alternate_email</span>
<input class="w-full bg-[#0A0A0C] border-0 border-b-2 border-outline-variant/50 focus:border-tertiary text-on-surface font-label-md text-label-md py-3 pl-10 pr-4 rounded-none outline-none focus:ring-0 focus:shadow-[0_0_15px_rgba(0,220,229,0.2)] transition-all placeholder:text-on-surface-variant/30" id="email" name="email" placeholder="OPERATIVE_ID@NETWORK.IO" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="sr-only" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-tertiary transition-colors">lock</span>
<input class="w-full bg-[#0A0A0C] border-0 border-b-2 border-outline-variant/50 focus:border-tertiary text-on-surface font-label-md text-label-md py-3 pl-10 pr-4 rounded-none outline-none focus:ring-0 focus:shadow-[0_0_15px_rgba(0,220,229,0.2)] transition-all placeholder:text-on-surface-variant/30" id="password" name="password" placeholder="ACCESS_KEY" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between font-label-sm text-label-sm">
<div class="flex items-center">
<input class="h-4 w-4 bg-[#0A0A0C] border border-outline-variant rounded-none text-tertiary focus:ring-tertiary focus:ring-offset-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-on-surface-variant uppercase" for="remember-me">Persistent Link</label>
</div>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-tertiary hover:text-tertiary-fixed uppercase underline underline-offset-2 transition-colors" href="#">Reset Key?</a>
</div>
</div>
<!-- Actions -->
<div class="space-y-4 pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-none shadow-sm font-label-md text-label-md text-white bg-primary-container hover:bg-inverse-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:ring-offset-surface uppercase tracking-widest glitch-hover transition-all" type="button">
<span class="mr-2">[</span> ENTER OPS <span class="ml-2">]</span>
</button>
<button class="w-full flex justify-center py-3 px-4 border-2 border-on-secondary rounded-none shadow-sm font-label-md text-label-md text-secondary bg-transparent hover:bg-gradient-to-r hover:from-on-secondary hover:to-secondary-container hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary focus:ring-offset-surface uppercase tracking-widest transition-all" type="button">
<span class="mr-2">[</span> CREATE ACCOUNT <span class="ml-2">]</span>
</button>
</div>

</div>

<footer class="fixed bottom-0 w-full flex items-center justify-between px-margin-mobile md:px-margin-desktop h-10 border-t border-outline-variant/20 bg-surface-container-lowest/90 backdrop-blur-md z-40">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant/60">FRAUDOPS SYSTEM v2.4.0</span>
<div class="flex gap-4">
<a class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant/60 hover:text-tertiary transition-colors" href="#">Privacy Protocol</a>
</div>
</footer>
<script>
        // Simple ambient noise effect on buttons
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.transform = `skewX(${(Math.random() - 0.5) * 4}deg)`;
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'skewX(0deg)';
            });
        });
    </script>
</body></html>
