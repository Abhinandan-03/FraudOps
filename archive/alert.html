<style>
        /* Urban Cyberpunk / Cyber-Brutalism Styles */
        @import url('https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&family=Geist:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

        body {
            background-color: #0A0A0C; /* Deep Tech Foundation */
            background-image: radial-gradient(circle at center, rgba(162, 15, 255, 0.1) 0%, transparent 60%),
                              linear-gradient(0deg, rgba(20, 0, 30, 0.8) 0%, transparent 100%);
            color: #e5e1e4;
            overflow-x: hidden;
        }

        /* Halftone / Glitch Texture Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.5;
        }

        /* Scanline Animation */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scanline-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 10px;
            background: linear-gradient(to bottom, transparent, rgba(162, 15, 255, 0.5), transparent);
            opacity: 0.3;
            animation: scanline 4s linear infinite;
            pointer-events: none;
            z-index: 100;
        }

        /* Glitch Animation for High Tension */
        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            10% { transform: skew(-2deg); }
            20% { transform: skew(2deg); }
            30% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }
        .glitch-text {
            position: relative;
            animation: glitch-skew 3s infinite alternate-reverse;
        }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch-text::before {
            left: 2px;
            text-shadow: -1px 0 rgba(162, 15, 255, 0.7);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }
        .glitch-text::after {
            left: -2px;
            text-shadow: -1px 0 rgba(0, 220, 229, 0.7);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(22px, 9999px, 83px, 0); }
            20% { clip: rect(6px, 9999px, 54px, 0); }
            40% { clip: rect(100px, 9999px, 2px, 0); }
            60% { clip: rect(72px, 9999px, 98px, 0); }
            80% { clip: rect(15px, 9999px, 26px, 0); }
            100% { clip: rect(41px, 9999px, 60px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(11px, 9999px, 80px, 0); }
            40% { clip: rect(54px, 9999px, 15px, 0); }
            60% { clip: rect(98px, 9999px, 23px, 0); }
            80% { clip: rect(31px, 9999px, 75px, 0); }
            100% { clip: rect(2px, 9999px, 44px, 0); }
        }

        /* Stealth Button Glow */
        .btn-stealth {
            border: 2px solid #a20fff;
            background: transparent;
            box-shadow: 0 0 15px rgba(162, 15, 255, 0.3);
            transition: all 0.2s ease;
        }
        .btn-stealth:hover {
            background: linear-gradient(90deg, rgba(162, 15, 255, 0.8), rgba(108, 0, 174, 0.8));
            box-shadow: 0 0 25px rgba(162, 15, 255, 0.6);
            transform: scale(1.02);
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 0 40px rgba(162, 15, 255, 0.1);
        }

        /* Pulse Animation for Risk Score */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(226, 27, 35, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(226, 27, 35, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(226, 27, 35, 0); }
        }
        .pulse-critical {
            animation: pulse-ring 2s infinite;
        }
