<!-- Script for basic interaction demo (Difficulty selection) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('#difficulty-selector button');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all
                    buttons.forEach(b => {
                        b.className = 'relative p-6 border border-outline-variant/30 text-left flex flex-col gap-2 transition-all duration-300 hover:border-tertiary/50 hover:bg-surface-variant/30 group/btn focus:outline-none';
                        const title = b.querySelector('.font-display-lg');
                        title.className = 'font-display-lg text-headline-lg-mobile text-on-surface-variant group-hover/btn:text-tertiary uppercase tracking-tighter transition-colors';
                        const desc = b.querySelector('.font-label-sm');
                        desc.className = 'font-label-sm text-on-surface-variant/60 block mt-auto';
                        
                        // Remove active elements
                        const corner = b.querySelector('.border-t-transparent');
                        if(corner) corner.className = 'absolute top-0 right-0 w-0 h-0 border-t-[16px] border-r-[16px] border-t-transparent border-r-transparent group-hover/btn:border-r-tertiary/50 transition-all';
                        
                        const bottomBar = b.querySelector('.bg-primary-container.absolute.bottom-0');
                        if(bottomBar) bottomBar.remove();
                        const scanline = b.querySelector('.bg-\\[linear-gradient');
                        if(scanline) scanline.remove();
                    });

                    // Set Active
                    btn.className = 'relative p-6 border border-primary-container bg-primary-container/10 text-left flex flex-col gap-2 transition-all duration-300 shadow-[inset_0_0_20px_rgba(226,27,35,0.1)] focus:outline-none transform scale-[1.02]';
                    
                    const title = btn.querySelector('.font-display-lg');
                    title.className = 'font-display-lg text-headline-lg-mobile text-primary-fixed uppercase tracking-tighter drop-shadow-[0_0_8px_rgba(255,180,172,0.5)]';
                    
                    const desc = btn.querySelector('.font-label-sm');
                    desc.className = 'font-label-sm text-primary-fixed-dim/80 block mt-auto';

                    const corner = btn.querySelector('.border-t-transparent');
                    if(corner) corner.className = 'absolute top-0 right-0 w-0 h-0 border-t-[16px] border-r-[16px] border-t-transparent border-r-primary-container';

                    // Add active decorative elements
                    if(!btn.querySelector('.bg-primary-container.absolute.bottom-0')) {
                        const bottomBar = document.createElement('div');
                        bottomBar.className = 'absolute bottom-0 left-0 h-1 w-full bg-primary-container shadow-[0_0_10px_rgba(226,27,35,0.8)]';
                        btn.appendChild(bottomBar);
                    }
                    if(!btn.querySelector('.bg-\\[linear-gradient')) {
                        const scanline = document.createElement('div');
                        scanline.className = 'absolute inset-0 bg-[linear-gradient(to_bottom,transparent,rgba(226,27,35,0.1),transparent)] bg-[length:100%_4px] opacity-30 pointer-events-none';
                        btn.insertBefore(scanline, btn.firstChild);
                    }
                });
            });
        });
    </script>
