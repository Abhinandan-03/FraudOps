<style>
        /* Base Cyber-Brutalism Styles */
        body {
            background-color: #0A0A0C;
            /* Subtle halftone overlay */
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 8px 8px;
            overflow-x: hidden;
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .glitch-hover:hover {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
            box-shadow: 4px 4px 0 #00dce5; /* Cyber Teal */
        }

        /* Pulse Animation */
        @keyframes pulse-ring {
            0% { transform: scale(.8); opacity: .8; box-shadow: 0 0 0 0 rgba(226, 27, 35, 0.7); }
            100% { transform: scale(1.5); opacity: 0; box-shadow: 0 0 0 50px rgba(226, 27, 35, 0); }
        }

        .pulse-effect::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(10, 10, 12, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Cinematic Glows */
        .glow-crimson {
            box-shadow: 0 0 40px rgba(226, 27, 35, 0.4);
        }
        
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 9999;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(226,27,35,0.2) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Dynamic Streaks -->

</div>
<div class="scanline"></div>
<main class="w-full max-w-4xl px-margin-mobile md:px-margin-desktop z-10 relative">
<!-- Success Container -->
<div class="glass-panel p-8 md:p-12 transform skew-x-[-2deg] glow-crimson flex flex-col items-center justify-center text-center relative overflow-hidden">
<!-- High Energy Header -->
<div class="mb-8 relative pulse-effect">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-primary-container uppercase italic tracking-tighter drop-shadow-[0_0_15px_rgba(226,27,35,0.8)]">
                    CORRECT DECISION
                </h1>
<div class="absolute -top-4 -right-8 transform rotate-12">

                    </span>
</div>
</div>
<!-- Streak Indicator -->

<span class="material-symbols-outlined text-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">bolt</span>

</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4 w-full mb-12 transform skew-x-[2deg]">

</div>

<span class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Fraud Halted</span>
</div>
</div>

<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
